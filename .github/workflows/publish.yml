name: Publish @4sh/ui-kit-react to npm

# Publishes ONE package: @4sh/ui-kit-react, the compiled components, with the
# MCP server embedded under `mcp/` (as @4sh/ui-kit embeds it on the Angular
# side). @4sh/ui-kit-react-mcp stays private: it is where the server is built,
# not something consumers install. The copy-mode CLI (@4sh/ui-kit-react-cli)
# joins this workflow in phase 4, published first, as the Angular companion is.
#
# Transposed from the Angular starter's publish-ui-kit.yml, where every guard
# below was paid for once. The differences: the package is published from its
# source folder (packages/ui-kit-react, no dist/ copy), and the tarball is
# checked by scripts/kit-tarball.check.mjs instead of by eye.

# Manual trigger only: publishing is irreversible (a name+version can never be
# reused, and `npm unpublish` is limited to 72h), so it never fires on a push.
#
# Three jobs on purpose:
#   verify:  always runs, builds and shows the exact tarball contents. No
#            secret, no approval needed, so it is cheap to run as often as
#            you like.
#   publish: only when dry_run is false, and gated behind the `npm-publish`
#            environment so a human must approve before the job can run.
#   release: tags the published commit and opens the GitHub release, from the
#            CHANGELOG section of that version. Split out of `publish` on
#            purpose: it needs `contents: write`, which has no business sitting
#            in the job that holds the npm publishing right.
#
# Authentication uses npm **Trusted Publishing** (OIDC): there is no token and no
# secret. npm verifies the job's OIDC claims against the repository + workflow
# declared on the package settings page, then issues a short-lived publish right
# valid for this job only. The environment gate stays essential: OIDC proves
# *where* the publish comes from, never *who* decided it.
#
# ⚠️ DEPENDENCIES ARE INSTALLED WITH pnpm, BUT THE PUBLISH STEPS USE THE npm CLI.
# That is deliberate, not a migration left half-done: do not "finish" it.
# `pnpm publish` supported OIDC on pnpm 10, then regressed on 11.0.8 (the
# registry answers 404 because the OIDC exchange never happens): see
# pnpm/pnpm#11513. Publishing is IRREVERSIBLE: carrying that risk buys nothing.
# The npm CLI is also what the guardrail step below inspects.
#
# If this ever has to move, the acceptance test is a real dry run against the
# registry from this workflow, not a green local `pnpm publish --dry-run`, which
# never performs the OIDC exchange at all.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (inspect the tarball without publishing)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: Build & inspect tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read Node.js version from .nvmrc
        id: nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      # Avant `setup-node` : c'est la présence de `pnpm` sur le PATH qui permet à
      # setup-node de localiser le store à mettre en cache. La version installée
      # vient du champ `packageManager` du package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nvmrc.outputs.NODE_VERSION }}
          cache: 'pnpm'

      # Before anything expensive, and above all before the irreversible publish:
      # the release notes are the CHANGELOG section of this version, so a missing
      # section must surface here, during the dry run, and not once the version
      # is already on the registry.
      - name: Check the CHANGELOG documents this version
        run: |
          version=$(node -p "require('./packages/ui-kit-react/package.json').version")
          echo "Release notes for $version:"
          node scripts/changelog.section.mjs "$version"

      # `postinstall` generates the tokens and the `exports` table.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the package
        run: pnpm kit:build

      # Builds the server from the doc of THIS commit (its manifest is not
      # committed), copies it into packages/ui-kit-react/mcp/, then smoke-tests
      # that copy over stdio. A tarball without its server must fail here, not
      # reach the registry: on the Angular side, 0.4.0 shipped without it
      # because the step that assembled it was not in the workflow (FSHSP-141).
      - name: Embed the MCP server into the package
        run: pnpm kit:mcp

      # Required files, every `exports` and `bin` target, no story/test/MDX,
      # and the same version in package.json, UI_KIT_VERSION and the MCP manifest.
      - name: Check the tarball contents
        run: pnpm kit:check

      - name: Show what would be published
        run: npm publish --dry-run
        working-directory: packages/ui-kit-react

  publish:
    name: Publish to npm
    needs: verify
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.published.outputs.version }}
    # Requires a human approval before this job starts: configure
    # *Settings → Environments → npm-publish → Required reviewers*.
    # ⚠️ Referencing an environment that does not exist yet creates it WITHOUT
    # protection rules, which silently removes the gate. See docs/PUBLISHING.md.
    environment: npm-publish
    permissions:
      contents: read
      # Required twice over: it mints the OIDC token npm exchanges for a publish
      # right, and it signs the provenance attestation.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read Node.js version from .nvmrc
        id: nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      # ⚠️ Deliberately NO `registry-url` on setup-node. That input writes
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into ~/.npmrc, and
      # with Trusted Publishing there is no NODE_AUTH_TOKEN, so the line resolves
      # to an EMPTY token. npm then considers itself authenticated, skips the
      # OIDC exchange entirely, and the registry rejects the anonymous PUT with a
      # misleading `E404 Not Found` (it masks a 403 on scoped packages).
      # registry.npmjs.org is the default registry anyway, so nothing is lost.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nvmrc.outputs.NODE_VERSION }}
          cache: 'pnpm'

      # Trusted Publishing needs npm >= 11.5.1. Node 24.15.0 (.nvmrc) ships
      # 11.12.1, so nothing to install: this only makes the version visible in
      # the logs, and turns a downgrade of .nvmrc into an explicit failure
      # instead of a confusing 401 at publish time.
      - name: Check npm supports Trusted Publishing
        run: |
          version=$(npm --version)
          echo "npm $version"
          required=11.5.1
          if [ "$(printf '%s\n%s\n' "$required" "$version" | sort -V | head -n1)" != "$required" ]; then
            echo "::error::Trusted Publishing requires npm >= $required, got $version. Bump .nvmrc or install npm@latest."
            exit 1
          fi

          # An auth token configured for the registry, even an EMPTY one as
          # setup-node's `registry-url` produces without NODE_AUTH_TOKEN, makes
          # npm skip the OIDC exchange and fail with a misleading E404. Read the
          # .npmrc files directly: `npm config get` refuses to return protected
          # auth options.
          for rc in "$HOME/.npmrc" "$GITHUB_WORKSPACE/.npmrc" "$GITHUB_WORKSPACE/packages/ui-kit-react/.npmrc"; do
            if [ -f "$rc" ] && grep -q '_authToken' "$rc"; then
              echo "::error::$rc configures an _authToken; it disables Trusted Publishing. Remove registry-url from setup-node."
              exit 1
            fi
          done

          # Proves GitHub is actually minting OIDC tokens for this job. These
          # variables only exist when the id-token write permission is granted;
          # without them npm publishes unauthenticated and dies on ENEEDAUTH,
          # several steps later, with no hint of the real cause.
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::No OIDC token available: check the id-token write permission on this job."
            exit 1
          fi
          echo "OIDC token endpoint available."

          # The three claims npm matches against the Trusted Publisher entry.
          # A mismatch is otherwise invisible: the registry finds no match, stays
          # silent, and npm carries on unauthenticated. Copy these verbatim into
          # the package settings page if publishing ever fails on ENEEDAUTH.
          echo "repository:  $GITHUB_REPOSITORY"
          echo "workflow:    $(basename "${GITHUB_WORKFLOW_REF%%@*}")"
          echo "environment: $ENVIRONMENT_NAME"
        env:
          ENVIRONMENT_NAME: npm-publish

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Rebuilt here rather than carried over as an artifact, so the published
      # tarball is unambiguously produced by this job, which is also what the
      # provenance attestation ends up certifying. Same three steps as `verify`.
      - name: Build the package
        run: pnpm kit:build

      - name: Embed the MCP server into the package
        run: pnpm kit:mcp

      - name: Check the tarball contents
        run: pnpm kit:check

      - name: Publish @4sh/ui-kit-react
        # No NODE_AUTH_TOKEN: npm exchanges the job's OIDC token for a
        # short-lived publish right (Trusted Publishing). `--provenance` stays
        # explicit even though OIDC implies it, so a fallback token publish
        # would still be attested.
        # `access: public` comes from the package's publishConfig: a scoped
        # package would otherwise default to `restricted` (paid plans only).
        run: npm publish --provenance
        working-directory: packages/ui-kit-react

      # Read from the manifest that was just published, so the tag can only ever
      # name the version npm accepted.
      - name: Record the published version
        id: published
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
        working-directory: packages/ui-kit-react

  release:
    name: Tag & GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      # Creates the tag and the release. Deliberately not granted to `publish`:
      # that job already carries the npm publishing right, and the two should not
      # be reachable from the same compromised step.
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # `gh release create` reuses the tag when it already exists and creates it
      # on --target otherwise.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          tag="v$VERSION"

          # Idempotent: re-running this job alone (after a transient failure)
          # must not error out on an already-published release. A duplicate
          # *version* cannot reach this point: npm rejects a republish.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::Release $tag already exists, nothing to do."
            exit 0
          fi

          # Already validated by `verify`; if it fails here the CHANGELOG changed
          # between the two jobs, and failing is the right answer.
          node scripts/changelog.section.mjs "$VERSION" > release-notes.md

          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file release-notes.md

      # Optional: skipped, not failed, when the repository has no
      # SLACK_WEBHOOK_URL secret. The release above is what matters.
      - name: Notify Slack
        if: ${{ success() && inputs.dry_run == false }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::notice::No SLACK_WEBHOOK_URL secret, notification skipped."
            exit 0
          fi
          curl -sf -X POST --data-urlencode "payload={\"username\": \"incoming-webhook\", \"text\": \":package: @4sh/ui-kit-react v${VERSION} publié, <https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}|release notes>\", \"icon_emoji\": \":rocket:\"}" \
            "$SLACK_WEBHOOK_URL"
